<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#687386; --line:#e4e8ef; --blue:#3157d5; --blue2:#2445b4; --bg:#f5f7fb; --green:#147d4b; --red:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:760px; margin:0 auto; padding:28px 16px 56px; }
    .brand { font-size:13px; font-weight:800; letter-spacing:.12em; color:var(--blue); text-transform:uppercase; }
    h1 { margin:8px 0 6px; font-size:28px; letter-spacing:-.04em; }
    .sub { margin:0; color:var(--muted); line-height:1.6; font-size:14px; }
    .card { background:white; border:1px solid var(--line); border-radius:20px; padding:24px; margin-top:22px; box-shadow:0 8px 24px rgba(24,39,75,.04); }
    label { display:block; font-size:13px; font-weight:700; margin:0 0 8px; }
    input { width:100%; border:1px solid #cfd6e2; border-radius:12px; padding:14px 13px; font-size:16px; outline:none; background:#fff; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(49,87,213,.12); }
    .field { margin-top:17px; }
    button { border:0; border-radius:12px; background:var(--blue); color:#fff; padding:14px 18px; font-size:15px; font-weight:800; cursor:pointer; }
    button:hover { background:var(--blue2); }
    button:disabled { opacity:.55; cursor:wait; }
    .primary { width:100%; margin-top:20px; }
    .secondary { background:#eef2ff; color:#2445b4; }
    .secondary:hover { background:#e0e7ff; }
    .status { display:none; border-radius:12px; padding:14px; margin-top:16px; line-height:1.55; font-size:14px; white-space:pre-line; }
    .status.ok { display:block; background:#eaf8f0; color:#12633d; }
    .status.err { display:block; background:#fff0ef; color:var(--red); }
    .result { display:none; margin-top:16px; border:1px solid #ccebd9; background:#f4fcf7; border-radius:16px; padding:18px; }
    .result strong { font-size:23px; }
    .result .small { color:#426052; font-size:13px; margin-top:5px; }
    .admin-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .admin-head h2 { margin:0; font-size:19px; }
    .hidden { display:none !important; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; min-width:0; }
    .table-wrap { overflow:auto; margin-top:18px; border:1px solid var(--line); border-radius:12px; }
    table { border-collapse:collapse; width:100%; font-size:13px; background:#fff; }
    th,td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { background:#f8f9fc; color:#596579; position:sticky; top:0; }
    tr:last-child td { border-bottom:0; }
    .muted { color:var(--muted); font-size:12px; line-height:1.6; }
    .admin-link { margin-top:24px; text-align:center; }
    .linkbtn { border:0; background:transparent; color:#697386; padding:8px; font-size:12px; font-weight:600; }
    .linkbtn:hover { color:var(--blue); background:transparent; }
    .spinner { display:inline-block; width:13px; height:13px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(max-width:520px) { .wrap{padding:22px 12px 40px} .card{padding:19px} h1{font-size:25px} .row{flex-direction:column} }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">ATTENDANCE</div>
    <h1>출석 체크</h1>
    <p class="sub">이름과 휴대폰 번호 뒤 4자리를 입력해 주세요.<br>출석 버튼을 누르면 현재 시간이 기록됩니다.</p>

    <section class="card" id="attendCard">
      <form id="attendanceForm">
        <div class="field">
          <label for="name">이름</label>
          <input id="name" name="name" autocomplete="name" placeholder="이름 입력" required maxlength="40">
        </div>
        <div class="field">
          <label for="last4">휴대폰 번호 뒤 4자리</label>
          <input id="last4" name="last4" inputmode="numeric" autocomplete="off" placeholder="예: 1234" pattern="[0-9]{4}" maxlength="4" required>
        </div>
        <button class="primary" id="submitBtn" type="submit">출석 등록하기</button>
      </form>
      <div id="attendanceStatus" class="status" role="status" aria-live="polite"></div>
      <div id="attendanceResult" class="result">
        <div style="font-size:13px;font-weight:700;color:#147d4b;margin-bottom:8px">출석 등록 완료</div>
        <strong id="resultGroup"></strong>
        <div id="resultName" style="margin-top:7px;font-weight:700"></div>
        <div id="resultCommunity" class="small"></div>
        <div id="resultTime" class="small"></div>
      </div>
    </section>

    <section class="card hidden" id="adminCard">
      <div class="admin-head"><h2>관리자 페이지</h2><button type="button" class="linkbtn" id="closeAdmin">닫기</button></div>
      <div id="adminLogin">
        <p class="sub" style="margin-top:8px">관리자 비밀번호를 입력해 주세요.</p>
        <div class="field"><label for="adminPassword">관리자 비밀번호</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
        <button class="primary" id="loginBtn" type="button">로그인</button>
      </div>
      <div id="adminPanel" class="hidden">
        <p class="sub" style="margin-top:8px">현재 출석 현황입니다. 다시 입력된 출석은 가장 최근 시간으로 표시됩니다.</p>
        <div class="row" style="margin-top:16px">
          <button id="refreshBtn" type="button" class="secondary">현황 새로고침</button>
          <button id="downloadBtn" type="button">엑셀 파일 다운로드</button>
        </div>
        <div id="adminStatus" class="status" role="status" aria-live="polite"></div>
        <div id="adminSummary" class="muted" style="margin-top:12px"></div>
        <div class="table-wrap"><table><thead><tr><th>조</th><th>공동체</th><th>이름</th><th>연락처</th><th>1주차 출석</th></tr></thead><tbody id="adminRows"></tbody></table></div>
        <p class="muted">관리자 다운로드는 원본 스프레드시트를 Excel(.xlsx) 형식으로 내려받습니다.</p>
      </div>
    </section>

    <div class="admin-link"><button class="linkbtn" id="openAdmin" type="button">관리자</button></div>
  </main>
<script>
  const $ = id => document.getElementById(id);
  let adminPassword = '';

  function showStatus(id, message, kind) {
    const el = $(id);
    el.textContent = message || '';
    el.className = 'status ' + (kind || '');
  }
  function setBusy(button, busy, label) {
    button.disabled = busy;
    if (busy) { button.dataset.oldLabel = button.textContent; button.innerHTML = '<span class="spinner"></span>' + label; }
    else if (button.dataset.oldLabel) { button.textContent = button.dataset.oldLabel; delete button.dataset.oldLabel; }
  }

  $('attendanceForm').addEventListener('submit', event => {
    event.preventDefault();
    const name = $('name').value.trim();
    const last4 = $('last4').value.replace(/\D/g, '');
    const btn = $('submitBtn');
    $('attendanceResult').style.display = 'none';
    showStatus('attendanceStatus', '', '');
    setBusy(btn, true, '확인 중...');
    google.script.run
      .withSuccessHandler(result => {
        setBusy(btn, false);
        if (!result || !result.ok) {
          showStatus('attendanceStatus', result && result.message ? result.message : '출석 등록 중 오류가 발생했습니다.', 'err');
          return;
        }
        showStatus('attendanceStatus', result.message, 'ok');
        $('resultGroup').textContent = result.group ? result.group + '조' : '조 정보 확인 필요';
        $('resultName').textContent = result.name;
        $('resultCommunity').textContent = result.community ? '공동체: ' + result.community : '';
        $('resultTime').textContent = '출석 시간: ' + result.timestamp;
        $('attendanceResult').style.display = 'block';
      })
      .withFailureHandler(error => {
        setBusy(btn, false);
        showStatus('attendanceStatus', error && error.message ? error.message : '오류가 발생했습니다. 잠시 후 다시 시도해 주세요.', 'err');
      })
      .submitAttendance(name, last4);
  });

  $('last4').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0,4); });

  $('openAdmin').addEventListener('click', () => {
    $('adminCard').classList.remove('hidden');
    $('adminCard').scrollIntoView({behavior:'smooth', block:'start'});
    $('adminPassword').focus();
  });
  $('closeAdmin').addEventListener('click', () => $('adminCard').classList.add('hidden'));

  $('loginBtn').addEventListener('click', () => {
    const password = $('adminPassword').value;
    setBusy($('loginBtn'), true, '확인 중...');
    showStatus('adminStatus', '', '');
    google.script.run
      .withSuccessHandler(ok => {
        setBusy($('loginBtn'), false);
        if (!ok) { showStatus('adminStatus', '비밀번호가 올바르지 않습니다.', 'err'); return; }
        adminPassword = password;
        $('adminLogin').classList.add('hidden');
        $('adminPanel').classList.remove('hidden');
        loadAdminData();
      })
      .withFailureHandler(error => {
        setBusy($('loginBtn'), false);
        showStatus('adminStatus', error && error.message ? error.message : '로그인에 실패했습니다.', 'err');
      })
      .verifyAdmin(password);
  });
  $('adminPassword').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('refreshBtn').addEventListener('click', loadAdminData);

  function loadAdminData() {
    setBusy($('refreshBtn'), true, '불러오는 중...');
    showStatus('adminStatus', '', '');
    google.script.run
      .withSuccessHandler(rows => {
        setBusy($('refreshBtn'), false);
        const tbody = $('adminRows');
        tbody.replaceChildren();
        let count = 0;
        rows.forEach(person => {
          if (person.attendance) count++;
          const tr = document.createElement('tr');
          [person.group ? person.group + '조' : '', person.community, person.name, person.phone, person.attendance].forEach(value => {
            const td = document.createElement('td');
            td.textContent = value || '—';
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        $('adminSummary').textContent = '참가자 ' + rows.length + '명 · 출석 기록 ' + count + '명';
      })
      .withFailureHandler(error => {
        setBusy($('refreshBtn'), false);
        showStatus('adminStatus', error && error.message ? error.message : '출석 현황을 불러오지 못했습니다.', 'err');
      })
      .getAdminData(adminPassword);
  }

  $('downloadBtn').addEventListener('click', () => {
    setBusy($('downloadBtn'), true, '파일 준비 중...');
    showStatus('adminStatus', '', '');
    google.script.run
      .withSuccessHandler(file => {
        setBusy($('downloadBtn'), false);
        try {
          const raw = atob(file.base64);
          const bytes = new Uint8Array(raw.length);
          for (let i=0; i<raw.length; i++) bytes[i] = raw.charCodeAt(i);
          const blob = new Blob([bytes], {type:file.mimeType});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = file.filename;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showStatus('adminStatus', '엑셀 파일 다운로드를 시작했습니다.', 'ok');
        } catch (e) { showStatus('adminStatus', '파일을 준비했지만 다운로드를 시작하지 못했습니다.', 'err'); }
      })
      .withFailureHandler(error => {
        setBusy($('downloadBtn'), false);
        showStatus('adminStatus', error && error.message ? error.message : '엑셀 파일 다운로드에 실패했습니다.', 'err');
      })
      .exportWorkbook(adminPassword);
  });
</script>
</body>
</html>
